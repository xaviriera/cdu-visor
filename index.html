<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visores CdU de 0 a Éxito</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');
  :root{
    --navy:#163D60;
    --ocre:#E29F34;
    --crema:#FDFBF7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Montserrat',Arial,sans-serif;
    background:var(--crema);
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .contenedor{
    max-width:520px;
    text-align:center;
  }
  .marca{
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    font-size:0.85rem;
    color:var(--ocre);
    margin-bottom:18px;
  }
  h1{
    font-weight:300;
    font-size:1.6rem;
    line-height:1.4;
    color:var(--navy);
    margin-bottom:16px;
  }
  p{
    font-weight:400;
    font-size:0.95rem;
    line-height:1.6;
    color:var(--navy);
    opacity:0.75;
  }
  .linea{
    width:48px;
    height:2px;
    background:var(--ocre);
    margin:24px auto;
  }
</style>
</head>
<body>
<div class="contenedor">
  <div class="marca">CdU de 0 a Éxito</div>
  <h1>Área de visores del inversor</h1>
  <div class="linea"></div>
  <p>Cada operación publicada aquí tiene su propia dirección privada.<br>
  Si dispone de un enlace, accederá directamente a él.</p>
</div>
</body>
</html>
